<style>
:root {
  color-scheme: light;
  --page: #f9f9f9; --surface: #ffffff; --cont1: #f1f1f1; --cont2: #e6e6e6;
  --ink: #191919; --ink2: #666666; --hair: #e7e7e7; --axis: #c2c2c2;
  --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.05); --accent: #1b64be;
  --lv-s: #00b894; --lv-r: #257de0; --lv-c: #f47230; --lv-k: #8a8a8a; --lv-m: #cfcfcf;
  --age-0: #84b9f3; --age-1: #519ced; --age-2: #257de0; --age-3: #1b64be; --age-4: #0f4a96;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0b0b0b; --surface: #191919; --cont1: #232323; --cont2: #2c2c2c;
    --ink: #efefef; --ink2: #9c9c9c; --hair: #303030; --axis: #474747;
    --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06); --accent: #6aabf1;
    --lv-s: #00a888; --lv-r: #338ced; --lv-c: #e76624; --lv-k: #6a6a6a; --lv-m: #3d3d3d;
    --age-0: #1757ac; --age-1: #2370cd; --age-2: #338ced; --age-3: #6aabf1; --age-4: #9dc8f7;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0b0b0b; --surface: #191919; --cont1: #232323; --cont2: #2c2c2c;
  --ink: #efefef; --ink2: #9c9c9c; --hair: #303030; --axis: #474747;
  --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06); --accent: #6aabf1;
  --lv-s: #00a888; --lv-r: #338ced; --lv-c: #e76624; --lv-k: #6a6a6a; --lv-m: #3d3d3d;
  --age-0: #1757ac; --age-1: #2370cd; --age-2: #338ced; --age-3: #6aabf1; --age-4: #9dc8f7;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page); color: var(--ink);
  display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden;
}
button { font: inherit; color: inherit; }
header {
  display: flex; align-items: center; gap: 12px; padding: 8px 14px;
  border-bottom: 1px solid var(--hair); background: var(--surface); min-width: 0;
}
.brand { font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
#crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; flex: 1; overflow: hidden; }
#crumbs button {
  border: 0; background: none; padding: 3px 6px; border-radius: 5px; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22ch; color: var(--ink2);
}
#crumbs button:hover { background: var(--wash); color: var(--ink); }
#crumbs button[aria-current] { color: var(--ink); font-weight: 600; cursor: default; flex-shrink: 0; max-width: 34ch; }
#crumbs .sep { color: var(--axis); flex-shrink: 0; }
.tools { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.btn {
  border: 1px solid var(--border); background: var(--surface); padding: 4px 10px;
  border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--wash); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.primary:hover:not(:disabled) { background: var(--ink); opacity: .88; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg-label { color: var(--ink2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
#mapwrap { position: relative; min-width: 0; min-height: 0; background: var(--surface); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
#tip {
  position: absolute; pointer-events: none; z-index: 5; display: none; max-width: 320px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 6px 22px rgba(0,0,0,.18); padding: 7px 10px;
}
#tip .v { font-weight: 700; font-size: 14px; }
#tip .n { overflow-wrap: anywhere; }
#tip .m { color: var(--ink2); font-size: 12px; }
#overlay {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  padding: 24px; background: var(--surface);
}
#overlay .card { max-width: 440px; text-align: center; }
#overlay h3 { margin: 0 0 6px; font-size: 16px; }
#overlay p { margin: 0 0 14px; color: var(--ink2); }
#busy {
  position: absolute; top: 8px; right: 8px; display: none; z-index: 4;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px;
  font-size: 12px; color: var(--ink2);
}

#banner {
  display: none; align-items: center; gap: 12px; padding: 8px 14px; background: var(--cont1);
  border-bottom: 1px solid var(--hair); flex-wrap: wrap;
}
#banner span { flex: 1; min-width: 200px; }
#gate {
  position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
  padding: 24px; background: var(--page);
}
#gate .card { max-width: 480px; }
#gate h1 { margin: 0 0 8px; font-size: 20px; }
#gate p { margin: 0 0 14px; color: var(--ink2); white-space: pre-wrap; overflow-wrap: anywhere; }
#gate .actions { margin-top: 0; }
#side { border-left: 1px solid var(--hair); background: var(--surface); overflow-y: auto; min-height: 0; }
#side section { padding: 14px 16px; border-bottom: 1px solid var(--hair); }
.kind { color: var(--ink2); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
h2 { margin: 2px 0 2px; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.path { color: var(--ink2); font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
.bigsize { margin-top: 8px; font-size: 22px; font-weight: 700; }
.bigsize small { font-size: 12px; font-weight: 400; color: var(--ink2); margin-left: 6px; }
.scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin: 12px 0 4px; }
.scale div {
  text-align: center; font-size: 11px; padding: 4px 2px; background: var(--cont1); color: var(--ink2);
  border-radius: 3px; white-space: nowrap;
}
.scale div.on { color: #0b0b0b; font-weight: 700; }
.scale div.on.s { background: var(--lv-s); } .scale div.on.r { background: var(--lv-r); }
.scale div.on.c { background: var(--lv-c); } .scale div.on.k { background: var(--lv-k); }
.scale-cap { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink2); }
.verdict { margin: 12px 0 2px; font-weight: 700; font-size: 14px; }
.why { margin: 2px 0 8px; }
.sub { font-weight: 600; margin: 10px 0 2px; font-size: 12px; color: var(--ink2); text-transform: uppercase; letter-spacing: .04em; }
ul.how, ul.notes { margin: 0; padding-left: 18px; }
ul.how li, ul.notes li { margin: 3px 0; }
code { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--cont1); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 12px 0 0; }
dl.facts dt { color: var(--ink2); } dl.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.muted { color: var(--ink2); }
.small { font-size: 12px; }
h3.sec { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink2); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h3.sec span { text-transform: none; letter-spacing: 0; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: flex; align-items: center; gap: 2px; }
.row {
  flex: 1; min-width: 0; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center;
  border: 0; background: none; text-align: left; padding: 4px 6px; border-radius: 5px; cursor: pointer; position: relative;
}
.row:hover { background: var(--wash); }
.row.sel { background: var(--wash); box-shadow: inset 2px 0 0 var(--ink); }
.row .sw { width: 10px; height: 10px; border-radius: 2px; }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sz { color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .bar { position: absolute; left: 24px; bottom: 1px; height: 2px; background: var(--axis); border-radius: 1px; }
.icon { border: 0; background: none; cursor: pointer; padding: 3px 6px; border-radius: 5px; color: var(--ink2); }
.icon:hover { background: var(--wash); color: var(--ink); }
.total { display: flex; justify-content: space-between; font-weight: 700; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hair); }

footer {
  display: flex; align-items: center; gap: 16px; padding: 6px 14px; border-top: 1px solid var(--hair);
  background: var(--surface); font-size: 12px; color: var(--ink2); min-width: 0;
}
#legend { display: flex; gap: 12px; flex-wrap: nowrap; align-items: center; flex-shrink: 0; }
#legend .li { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
#legend .sw { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
#hint { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
#status { white-space: nowrap; display: flex; align-items: center; gap: 8px; color: var(--ink); flex-shrink: 0; }
#status progress { width: 110px; height: 6px; }
@media (max-width: 900px) {
  body { overflow: auto; grid-template-rows: auto auto auto auto; }
  main { grid-template-columns: 1fr; }
  #mapwrap { height: 58vh; }
  #side { border-left: 0; border-top: 1px solid var(--hair); overflow: visible; }
  #hint { display: none; }
}
</style>

<body>
<header>
  <div class="brand">Disk Map</div>
  <nav id="crumbs" aria-label="Location"></nav>
  <div class="tools">
    <span class="seg-label" id="colorlabel">Color by</span>
    <div class="seg" role="group" aria-labelledby="colorlabel">
      <button type="button" data-mode="imp" aria-pressed="true">Importance</button>
      <button type="button" data-mode="age" aria-pressed="false">Age</button>
    </div>
    <button type="button" class="btn" id="zoomout" title="Zoom out one level (Esc)">Zoom out</button>
    <button type="button" class="btn" id="rescan" title="Read this folder again from disk">Rescan this folder</button>
  </div>
</header>
<div id="banner"><span id="banner-text"></span><div id="banner-actions"></div></div>
<main>
  <div id="mapwrap">
    <canvas id="map" tabindex="0" role="img" aria-label="Storage treemap. The same items are listed in the Contents panel."></canvas>
    <div id="busy">Loading…</div>
    <div id="tip" role="status"></div>
    <div id="overlay"><div class="card"><h3 id="ov-title"></h3><p id="ov-text"></p><div id="ov-actions"></div></div></div>
  </div>
  <aside id="side" aria-label="Details">
    <section id="detail" aria-live="polite"></section>
    <section id="contents"></section>
    <section id="shortlist"></section>
  </aside>
</main>
<div id="gate"><div class="card"><h1 id="gate-title"></h1><p id="gate-text"></p><div class="actions" id="gate-actions"></div></div></div>
<footer>
  <div id="legend"></div>
  <div id="hint">Click: select · Double-click: open that folder · Scroll: zoom one level · Esc: zoom out</div>
  <div id="status"></div>
</footer>

<script>
(function () {
'use strict';
var TOKEN = '__TOKEN__';
var IS_MAC = '__IS_MAC__' === '1';
// Three ways this page runs. HTTP: served by diskmap.py on this computer. APP: installed as a
// desktop app, where it runs the scanner itself. DEMO: anywhere else, on built-in example data.
var HTTP = TOKEN !== '';
var desktop = null, engine = null, demo = null;
var F = { DENIED: 1, MOUNT: 2, NET: 4, CLOUD: 8, PKG: 16, LINK: 32, ERR: 64 };
var LEVELS = {
  s: { label: 'Safe to clear', mark: '✓' },
  r: { label: 'Your call', mark: '◆' },
  c: { label: 'Careful', mark: '▲' },
  k: { label: 'Keep', mark: '■' },
  m: { label: 'Mixed', mark: '' },
  u: { label: 'Not recognized', mark: '?' }
};
var AGES = [
  { max: 30 * 86400, label: 'Under 1 month' }, { max: 182 * 86400, label: '1 to 6 months' },
  { max: 365 * 86400, label: '6 to 12 months' }, { max: 730 * 86400, label: '1 to 2 years' },
  { max: Infinity, label: 'Over 2 years' }
];
function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

// ---------- formatting ----------
function fmtBytes(n) {
  if (!(n > 0)) return '0 bytes';
  if (n < 1000) return n + ' bytes';
  var u = ['KB', 'MB', 'GB', 'TB', 'PB'], i = -1;
  do { n /= 1000; i++; } while (n >= 999.5 && i < u.length - 1);
  var d = n >= 100 ? 0 : n >= 10 ? 1 : 2;
  if (i === 0) d = 0;
  return n.toFixed(d) + ' ' + u[i];
}
function fmtNum(n) { return (n || 0).toLocaleString(); }
function fmtDate(ts) {
  return new Date(ts * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}
function rel(ts) {
  var s = Date.now() / 1000 - ts;
  if (s < 90) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' minutes ago';
  if (s < 86400 * 1.5) return Math.round(s / 3600) + ' hours ago';
  if (s < 86400 * 60) return Math.round(s / 86400) + ' days ago';
  if (s < 86400 * 365 * 2) return Math.round(s / (86400 * 30.4)) + ' months ago';
  return (s / (86400 * 365)).toFixed(1) + ' years ago';
}
function pct(a, b) {
  if (!(b > 0)) return '';
  var p = 100 * a / b;
  return (p >= 10 ? p.toFixed(0) : p >= 1 ? p.toFixed(1) : p >= 0.1 ? p.toFixed(2) : '<0.1') + '%';
}
function ageBucket(mt) {
  var a = Date.now() / 1000 - mt;
  for (var i = 0; i < AGES.length; i++) if (a < AGES[i].max) return i;
  return AGES.length - 1;
}
function nodeName(n) {
  if (n.k === 'o') return fmtNum(n.cnt) + (n.cnt === 1 ? ' smaller item' : ' smaller items');
  if (n.k === 'u') return n.sc ? 'Not scanned yet' : 'Not visible to the scan';
  if (n.k === 'e') return 'Free space';
  return n.n;
}

// ---------- server ----------
function api(url, body) {
  var opts = { headers: { 'X-Diskmap-Token': TOKEN } };
  if (body) { opts.method = 'POST'; opts.body = JSON.stringify(body); opts.headers['Content-Type'] = 'application/json'; }
  return fetch(url, opts).then(function (r) {
    return r.json().catch(function () { return { error: 'Unreadable response' }; }).then(function (j) {
      if (!r.ok) throw new Error(j.error || r.statusText);
      return j;
    });
  });
}
function asciiJSON(obj) {
  return JSON.stringify(obj).replace(/[\u007f-￿]/g, function (c) {
    return '\\u' + ('0000' + c.charCodeAt(0).toString(16)).slice(-4);
  });
}
// Runs the scanner (a Python script this page carries) as a child process of the desktop app
// and talks to it with one JSON message per line.
function startEngine(python, script, digest) {
  return new Promise(function (resolve, reject) {
    var proc, buf = '', errText = '', pending = new Map(), nextId = 1, ready = false, dead = false;
    function fail(msg) {
      if (dead) return;
      dead = true;
      pending.forEach(function (p) { p.reject(new Error('The scanner stopped')); });
      pending.clear();
      if (!ready) reject(new Error(msg));
      else if (engine === conn) { engine = null; engineGone(msg); }
    }
    var conn = {
      request: function (method, path) {
        if (dead) return Promise.reject(new Error('The scanner stopped'));
        var id = nextId++;
        return new Promise(function (res, rej) {
          pending.set(id, { resolve: res, reject: rej });
          proc.stdin.write(asciiJSON({ id: id, m: method, path: path }) + '\n').catch(function (e) {
            pending.delete(id); rej(e);
          });
        });
      },
      stop: function () { dead = true; try { proc.kill(); } catch (e) {} }
    };
    try { proc = desktop.childProcess.spawn(python, digest ? ['-I', '-u', '-c', LOADER, script, digest, '--stdio'] : ['-I', '-u', script, '--stdio']); }
    catch (e) { reject(e); return; }
    proc.stdout.on('data', function (chunk) {
      buf += chunk;
      var i;
      while ((i = buf.indexOf('\n')) >= 0) {
        var line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!line) continue;
        var msg;
        try { msg = JSON.parse(line); } catch (e) { continue; }
        if (msg.ready && !ready) { ready = true; conn.mac = !!msg.mac; resolve(conn); continue; }
        var p = pending.get(msg.id);
        if (!p) continue;
        pending.delete(msg.id);
        if (msg.e !== undefined) p.reject(new Error(msg.e)); else p.resolve(msg.r);
      }
    });
    proc.stderr.on('data', function (chunk) { errText = (errText + chunk).slice(-1500); });
    proc.on('error', function (e) { fail(String((e && e.message) || e)); });
    proc.on('exit', function (code) { fail((errText.trim() || 'The scanner exited') + (code ? ' (exit code ' + code + ')' : '')); });
    setTimeout(function () { if (!ready && !dead) { try { proc.kill(); } catch (e) {} fail('No answer from ' + python); } }, 25000);
  });
}
function demoNode(path) { return demo && demo.index[path]; }
function demoCall(method, path) {
  if (method === 'status') return Promise.resolve({ gen: 1, active: [], loading: 0 });
  var n = demoNode(path || demo.root);
  if (!n) return Promise.reject(new Error('Not in the example data'));
  if (method === 'tree') {
    var crumbs = [], p = n.p;
    while (p.length >= demo.root.length) { var d = demoNode(p); crumbs.unshift({ p: p, n: d.n }); p = p.replace(/\/[^\/]*$/, ''); }
    var pl = {}; for (var k in n) pl[k] = n[k];
    pl.crumbs = crumbs; pl.gen = 1; pl.rstate = 'done'; pl.root = demo.root;
    return Promise.resolve(pl);
  }
  if (method === 'info') {
    var r = demo.rules[n.ri] || {};
    var info = { p: n.p, n: n.n, lv: n.lv, title: r.t, why: r.w, how: r.h || [], kind: n.kind,
                 size: n.s, files: n.fc, dirs: n.dc, mt: n.mt,
                 notes: ['This is example data, not your files. Install the app to scan your own Mac.'] };
    if (n.via) { info.via = n.via; info.via_n = n.via.replace(/^.*\//, ''); }
    return Promise.resolve(info);
  }
  return Promise.reject(new Error('Not available with example data'));
}
function call(method, path) {
  if (HTTP) {
    if (method === 'scan' || method === 'reveal') return api('/api/' + method, { path: path || '' });
    if (method === 'status') return api('/api/status');
    return api('/api/' + method + '?path=' + enc(path || ''));
  }
  if (demo) return demoCall(method, path);
  if (method === 'reveal') return desktop.shell.showItemInFolder(path);
  if (!engine) return Promise.reject(new Error('The scanner is not running'));
  return engine.request(method, path || '');
}
// A name with a line break would paste as two paths, and the second could be a real folder.
function hasControl(p) { return /[\x00-\x1f\x7f]/.test(p); }
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise(function (resolve, reject) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (ok) resolve(); else reject(new Error('copy failed'));
  });
}
function enc(p) {
  try { return encodeURIComponent(p); } catch (e) {}
  // The name holds bytes that are not valid text. Encode them so the server gets the same bytes back.
  var out = '';
  function hx(b) { return '%' + (b < 16 ? '0' : '') + b.toString(16).toUpperCase(); }
  for (var i = 0; i < p.length; i++) {
    var c = p.charCodeAt(i);
    if (c >= 0xD800 && c <= 0xDBFF && i + 1 < p.length) {
      var d = p.charCodeAt(i + 1);
      if (d >= 0xDC00 && d <= 0xDFFF) { out += encodeURIComponent(p.substr(i, 2)); i++; continue; }
    }
    if (c >= 0xD800 && c <= 0xDFFF) { out += hx(0xE0 | (c >> 12)) + hx(0x80 | ((c >> 6) & 0x3F)) + hx(0x80 | (c & 0x3F)); continue; }
    out += encodeURIComponent(p.charAt(i));
  }
  return out;
}
var hashPaths = {};

// ---------- data store (client-side cache of everything fetched so far) ----------
var store = new Map();
var inflight = new Map();
var status = { gen: 0, active: [], loading: 0 };
var serverGen = 0;
var view = { path: '', node: null };
var selKey = null;
var colorMode = 'imp';

function childKey(parent, c) {
  if (c.p !== undefined && c.p !== null) return c.p;

  resizeTimer = setTimeout(function () { if (sizeCanvas()) relayout(null); }, 60);
}).observe($('mapwrap'));
if (window.matchMedia) {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var onScheme = function () { readColors(); renderLegend(); drawBase(); paint(); renderContents(); renderShortlist(); };
  if (mq.addEventListener) mq.addEventListener('change', onScheme); else if (mq.addListener) mq.addListener(onScheme);
  if (window.MutationObserver) new MutationObserver(onScheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}

// ---------- keep in step with the scanner ----------
var pollTimer = null;
function pollNow() { clearTimeout(pollTimer); poll(); }
function poll() {
  call('status').then(function (s) {
    var wasActive = status.active.length > 0;
    status = s;
    if (s.gen > serverGen) serverGen = s.gen;
    var genChanged = !!view.node && view.node.gen !== serverGen;
    renderStatus();
    if (genChanged || s.active.length || wasActive) {
      var path = view.path, seq = goSeq;
      fetchTree(path, true).then(function (n) {
        if (seq !== goSeq || view.path !== path) return;
        if (n.missing) { navigate(n.near || ''); return; }
        view.node = n;
        if (!animating) { relayout(null); renderCrumbs(); renderOverlay(); renderContents(); renderStatus(); }
        if (genChanged) renderDetail(); else updateDetailSize();
        if (!s.active.length) schedulePrefetch();
      }, function () {});
    }
  }, function () {
    if (HTTP) $('status').textContent = 'Disk Map has stopped. Start it again to continue.';
  }).then(function () {
    if (demo || (!HTTP && !engine)) return;
    pollTimer = setTimeout(poll, status.active.length || status.loading ? 900 : 4000);
  });
}

// ---------- start ----------
readColors();
renderLegend();
renderShortlist();
sizeCanvas();
function begin(path) {
  call('status').then(function (s) { status = s; serverGen = s.gen; }, function () {}).then(function () {
    view.path = null;
    go(path);
    if (!demo) pollTimer = setTimeout(poll, 700);
  });
}
function gate(title, text, actions) {
  $('gate-title').textContent = title; $('gate-text').textContent = text || '';
  var box = $('gate-actions'); box.textContent = '';
  (actions || []).forEach(function (a) { box.appendChild(actionBtn(a.label, a.act, true)); });
  $('gate').style.display = 'flex';
}
function ungate() { $('gate').style.display = 'none'; }
function drawIcon() {
  var cv = document.createElement('canvas'); cv.width = cv.height = 256;
  var c = cv.getContext('2d');
  function rr(x, y, w, h, r, fill) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); c.fillStyle = fill; c.fill();
  }
  rr(20, 20, 216, 216, 48, '#191919');
  rr(40, 40, 104, 176, 12, '#257de0');
  rr(152, 40, 64, 84, 12, '#00b894');
  rr(152, 132, 64, 38, 10, '#f47230');
  rr(152, 178, 28, 38, 8, '#8a8a8a');
  rr(188, 178, 28, 38, 8, '#cfcfcf');
  return cv.toDataURL('image/png');
}
var WINDOW_OPTIONS = { width: 1280, height: 820, minWidth: 860, minHeight: 560 };
function engineGone(msg) {
  clearTimeout(pollTimer);
  gate('The scanner stopped', msg, [{ label: 'Start it again', act: launchEngine }]);
}
// Same as LOADER in core.py (a test keeps them equal): the engine runs only if the file still
// holds the bytes just written, read once so it cannot be swapped between check and run.
var LOADER = "import hashlib,sys;p,h=sys.argv[1:3];s=open(p,'rb').read();" +
  "hashlib.sha256(s).hexdigest()==h or sys.exit('diskmap: '+p+' changed after Disk Map wrote it, so it was not run.');" +
  "sys.argv=[p]+sys.argv[3:];exec(compile(s,p,'exec'),{'__name__':'__main__','__file__':p})";
function sha256Hex(text) {
  if (!(window.crypto && crypto.subtle && window.TextEncoder)) return Promise.reject(new Error('no crypto'));
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  });
}
var APPLE_PY_HOMES = ['/Library/Developer/CommandLineTools/usr/bin/python3',
  '/Applications/Xcode.app/Contents/Developer/usr/bin/python3'];
function launchEngine() {
  gate('Starting the scanner…', 'Saved results from the last scan load first, so this is usually quick.');
  var home, script, digest = '';
  var src = $('engine-src').textContent;
  sha256Hex(src).then(function (d) { digest = d; }, function () {}).then(function () {
    return desktop.os.homedir();
  }).then(function (h) {
    home = h.replace(/\/$/, '');
    var dir = home + '/Library/Application Support/Disk Map';
    script = dir + '/engine.py';
    return desktop.fs.mkdir(dir, { recursive: true }).then(function () {
      return desktop.fs.writeFile(script, src, 'utf8');
    });
  }).then(function () {
    // Apple's python3 sits in folders only an admin can change, so it goes first when it is
    // really installed. Without the developer tools /usr/bin/python3 only offers to install them.
    var candidates = [home + '/.homebrew/bin/python3', '/opt/homebrew/bin/python3', '/usr/local/bin/python3', '/usr/bin/python3'];
    var errors = [];
    return Promise.all(APPLE_PY_HOMES.map(function (p) { return desktop.fs.exists(p); })).then(function (found) {
      if (found.indexOf(true) >= 0) candidates = ['/usr/bin/python3'].concat(candidates.slice(0, 3));
      return attempt(0);
    });
    function attempt(i) {
      if (i >= candidates.length) {
        throw new Error('Disk Map needs Python 3, which it could not start.\n' +
          'Apple\'s Command Line Tools provide it: run xcode-select --install in Terminal, then start Disk Map again.\n\n' + errors.join('\n'));
      }
      return desktop.fs.exists(candidates[i]).then(function (yes) {
        if (!yes) return attempt(i + 1);
        return startEngine(candidates[i], script, digest).catch(function (e) {
          errors.push(candidates[i] + ': ' + String((e && e.message) || e).slice(0, 300));
          return attempt(i + 1);
        });
      });
    }
  }).then(function (conn) {
    engine = conn; IS_MAC = conn.mac;
    store.clear(); infoCache.clear(); view.node = null; serverGen = 0;
    ungate();
    begin('');
  }).catch(function (e) {
    gate('Disk Map could not start', String((e && e.message) || e), [{ label: 'Try again', act: launchEngine }]);
  });
}
var accessTries = 0;
function checkAccess() {
  desktop.permissions.state('full-access').then(function (st) {
    if (st === 'granted') { launchEngine(); return; }
    if (st === 'prompt') {
      gate('Let Disk Map read your drives',
        'To measure every folder, Disk Map needs full access to this Mac. It only reads: it never deletes, moves or changes a file.',
        [{ label: 'Allow and start scanning', act: function () {
          desktop.permissions.request(['full-access']).then(checkAccess, checkAccess);
        } }]);
    } else if (st === 'denied') {
      gate('Access is turned off', 'Disk Map cannot scan without full access. You can turn it on in the app\'s permissions.',
        [{ label: 'Open permissions', act: function () { desktop.permissions.manage().then(checkAccess, checkAccess); } }]);
    } else if (accessTries++ < 5) {
      gate('Getting ready…', '');
      setTimeout(checkAccess, 1500);      // the app may still be signing in
    } else {
      accessTries = 0;
      gate('Full access is not available here',
        'This window cannot be given full access right now, so Disk Map cannot scan. Check that the Claude desktop app is signed in to the account that owns this artifact.',
        [{ label: 'Try again', act: checkAccess }]);
    }
  }, function (e) {
    gate('Disk Map could not start', String((e && e.message) || e), [{ label: 'Try again', act: checkAccess }]);
  });
}
function startDemo(d) {
  var raw = null;
  try { raw = JSON.parse($('demo-data').textContent); } catch (e) {}
  var text = 'Disk Map scans your drives only as an installed desktop app.';
  var box = $('banner-actions'); box.textContent = '';
  if (raw && raw.tree) {
    demo = { root: raw.root, rules: raw.rules, index: {} };
    (function walk(n, p) {
      n.p = p; demo.index[p] = n;
      (n.c || []).forEach(function (c) { if (c.k === 'd') walk(c, p + '/' + c.n); else { c.p = p + '/' + c.n; if (c.k === 'f') demo.index[c.p] = c; } });
    })(raw.tree, raw.root);
    IS_MAC = true;
    text = 'You are looking at example data. ' + text;
  }
  $('banner-text').textContent = text;
  $('banner').style.display = 'flex';
  var fallback = function () { $('banner-text').textContent = text + ' It can be installed from the Claude desktop app.'; };
  if (d && d.install) {
    d.install.state().then(function (st) {
      if (st === 'available') {
        box.appendChild(actionBtn('Install as app', function () { d.install.request().catch(function () {}); }, true));
      } else if (st === 'installed') {
        $('banner-text').textContent = text + ' It is already installed on this computer: open Disk Map from your apps.';
      } else fallback();
    }, fallback);
  } else fallback();
  if (demo) begin(demo.root);
  else gate('Disk Map runs as a desktop app', text + ' It can be installed from the Claude desktop app.');
}
function startApp(d) {
  desktop = d;
  d.app.dock.setIcon(drawIcon()).catch(function () {});
  d.window.getOptions().then(function (o) {
    if (JSON.stringify(o.options || {}) !== JSON.stringify(WINDOW_OPTIONS)) return d.window.setOptions(WINDOW_OPTIONS);
  }).catch(function () {});
  d.os.platform().then(function (pf) {
    if (pf !== 'darwin') { gate('Disk Map is built for macOS', 'This app reads Mac drives and does not support this system yet.'); return; }
    checkAccess();
  }, checkAccess);
}
if (HTTP) {
  // The link's key works once; keep the API token for reloads in this tab only, and take the
  // key out of the address bar so it does not sit in history or session restore.
  try {
    if (TOKEN !== '-') sessionStorage.setItem('diskmap.t', TOKEN);
    else TOKEN = sessionStorage.getItem('diskmap.t') || '-';
  } catch (e) {}
  if (location.search) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
  if (TOKEN === '-') {
    gate('Open Disk Map from its link', 'This link has expired. Use the link diskmap printed in your terminal, or start Disk Map again.');
  } else {
    var startPath = '';
    try { startPath = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    begin(startPath);
  }
} else if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('desktop').then(function (d) {
    if (d && d.fs) startApp(d); else startDemo(d);
  }, function () { startDemo(null); });
} else {
  startDemo(null);
}
})();
</script>
</body>
</html>
